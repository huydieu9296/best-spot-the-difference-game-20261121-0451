<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twin Lanterns — Spot the Difference</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="stage">
  <header id="hud">
    <div class="brand">🏮 Twin Lanterns</div>
    <div class="stat"><span class="label">Level</span><span id="hud-level">1 / 3</span></div>
    <div class="stat"><span class="label">Scene</span><span id="hud-scene">Lantern Night</span></div>
    <div class="stat"><span class="label">Score</span><span id="hud-score">0</span></div>
    <div class="stat"><span class="label">Time</span><span id="hud-time">2:30</span></div>
    <div class="stat big"><span class="label">Remaining</span><span id="hud-remaining">6</span></div>
  </header>
  <div id="board-wrap">
    <canvas id="board" width="1280" height="720" aria-label="Two near-identical pictures side by side. Click a difference to mark it."></canvas>
    <div id="overlay" class="hidden">
      <div class="panel">
        <h1 id="overlay-title"></h1>
        <p id="overlay-text"></p>
        <p id="overlay-sub" class="sub"></p>
        <button id="overlay-btn" type="button"></button>
        <p class="keys">Enter / Space — continue &nbsp;·&nbsp; H — hint (−50) &nbsp;·&nbsp; R — restart level &nbsp;·&nbsp; M — sound</p>
      </div>
    </div>
  </div>
  <footer id="helpbar">
    <span>Click a difference on either picture — a gold ring marks it on both sides.</span>
    <span class="right">H — hint (−50, 3 per level) &nbsp;·&nbsp; R — restart &nbsp;·&nbsp; M — sound on/off</span>
  </footer>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/game.js"></script>
</body>
</html>
